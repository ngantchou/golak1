name: golak
description: A new Flutter project.

version: 1.0.0+1

environment:
  sdk: ">=2.2.2 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^0.1.2
  flutter_launcher_icons: ^0.7.2+1
  pdf: ^1.3.13
  path_provider: ^1.1.0
  printing: ^2.0.4
  provider: ^3.0.0+1
  firebase_storage: ^3.0.3
  file_picker: ^1.3.8
  url_launcher: ^5.1.0
  http: ^0.12.0+2
  shared_preferences: ^0.5.3+4
  flutter_i18n: ^0.6.3

  onesignal_flutter: ^2.0.0
  flutter_slidable: ^0.5.4
  regexed_validator: ^1.0.2

  flutter_image: ^2.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:
   - images/golak@3x.png
   - images/people@3x.png
   - images/minimum-contribution@3x.png
   - images/number-of-people@3x.png
   - images/start-date@3x.png
   - images/total-amount@3x.png

   - images/people/p1@2x.jpg
   - images/people/p2@2x.jpg
   - images/people/p3@2x.jpg
   - images/people/p4@2x.jpg
   - images/people/p5@2x.jpg
   - images/people/p6@2x.jpg
   - images/people/p7@2x.jpg

   - icons/lock@3x.png
   - icons/add@3x.png
   - icons/back@3x.png
   - icons/check-circle-thin@3x.png
   - icons/check-circle@3x.png
   - icons/circle-add@3x.png
   - icons/circle@3x.png
   - icons/delete@3x.png
   - icons/download@3x.png
   - icons/email@3x.png
   - icons/home@3x.png
   - icons/ledger@3x.png
   - icons/message@3x.png
   - icons/person-outline@3x.png
   - icons/person@3x.png
   - icons/phone@3x.png
   - icons/reminders@3x.png
   - icons/share@3x.png
   - icons/statistics@3x.png
   - icons/whatsapp@3x.png
   - icons/back-arrow@3x.png
   - icons/calendar@3x.png
   - icons/contribution@3x.png
   - icons/country@3x.png
   - icons/people@3x.png
   - icons/search@3x.png
   - icons/slots@3x.png
   - icons/total-amount@3x.png

   - images/person.jpg

   - locales/en.json
   - locales/bn.json
   - locales/ur.json
   - locales/ar.json

   - countries/countries.json


  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins/Poppins-Regular.ttf
        - asset: fonts/Poppins/Poppins-Light.ttf
          weight: 300
        - asset: fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins/Poppins-Bold.ttf
          weight: 700

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "images/ic_launcher.png"
  # flutter packages pub run flutter_launcher_icons:main
